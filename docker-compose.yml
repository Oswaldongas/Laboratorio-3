services:
  cassandra:
    image: cassandra:4.1
    container_name: logistics
    ports:
      - "9042:9042"
    environment:
      # Requerido cuando rpc_address es 0.0.0.0 (imagen oficial)
      CASSANDRA_RPC_ADDRESS: "0.0.0.0"
      CASSANDRA_BROADCAST_RPC_ADDRESS: "127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
